<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-title="app.title">智能书签管家</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="brand">
        <img class="brand-logo" src="icons/icon_128.png" alt="智能书签管家 Logo">
        <div class="brand-text">
          <div class="brand-name" data-i18n="app.brandName">智能书签管家</div>
          <div class="brand-tagline" data-i18n="popup.tagline">快速扫描与即时整理</div>
        </div>
      </div>
    </header>

    <section class="stats-section">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="totalCount">—</div>
          <div class="stat-label" data-i18n="popup.totalBookmarks">总书签</div>
        </div>
        <div class="stat-card">
          <div class="stat-value danger" id="invalidCount">—</div>
          <div class="stat-label" data-i18n="popup.invalidLinks">无效链接</div>
        </div>
      </div>
    </section>

    <div id="statusMessage" class="status-message" role="status" aria-live="polite"></div>

    <section id="scanSection" class="scan-section">
      <div class="scan-header">
        <div class="scan-progress-ring">
          <svg viewBox="0 0 56 56">
            <circle class="progress-ring-bg" cx="28" cy="28" r="25"></circle>
            <circle class="progress-ring-fill" id="scanProgress" cx="28" cy="28" r="25" stroke-dasharray="157" stroke-dashoffset="157"></circle>
          </svg>
          <div class="scan-percentage" id="scanPercent">0%</div>
        </div>
        <div class="scan-info">
          <div class="scan-title" data-i18n="popup.quickScan">快速扫描</div>
          <div class="scan-status-text" id="scanText" data-i18n="popup.checking">检查书签有效性</div>
        </div>
      </div>
      <div class="scan-stats-row">
        <div class="scan-stat">
          <div class="scan-stat-value" id="scanChecked">0</div>
          <div class="scan-stat-label" data-i18n="popup.scanned">已检查</div>
        </div>
        <div class="scan-stat">
          <div class="scan-stat-value danger" id="scanInvalid">0</div>
          <div class="scan-stat-label" data-i18n="popup.invalid">无效</div>
        </div>
        <div class="scan-stat">
          <div class="scan-stat-value" id="scanTime">0s</div>
          <div class="scan-stat-label" data-i18n="popup.elapsed">耗时</div>
        </div>
      </div>
    </section>

    <section class="actions-section">
      <button id="quickScanBtn" class="btn btn-primary">
        <span class="btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
        </span>
        <span data-i18n="popup.quickScan">快速扫描</span>
      </button>
      <button id="openManagerBtn" class="btn btn-accent">
        <span class="btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20v-9"/><path d="M12 20V5"/><path d="M20 20v-6"/></svg>
        </span>
        <span data-i18n="popup.openManager">打开管理器</span>
      </button>
      <button id="refreshBtn" class="btn btn-secondary">
        <span class="btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        </span>
        <span data-i18n="popup.refreshStats">刷新统计</span>
      </button>
    </section>

    <section id="resultPanel" class="result-panel hidden">
      <div class="result-panel-header">
        <div>
          <div class="result-panel-title" data-i18n="popup.resultTitle">扫描结果</div>
          <div class="result-panel-meta" id="resultMeta" data-i18n="popup.noRecentScan">暂无最近扫描记录</div>
        </div>
        <span class="result-badge" id="selectedCountBadge">0 已选</span>
      </div>

      <div class="result-toolbar">
        <button id="selectAllBtn" class="mini-btn" data-i18n="popup.selectAll">全选</button>
        <button id="deleteSelectedBtn" class="mini-btn mini-btn-danger" disabled data-i18n="popup.deleteSelected">删除选中</button>
        <button id="clearResultsBtn" class="mini-btn" data-i18n="popup.clearResults">清空结果</button>
      </div>

      <div id="resultEmptyState" class="result-empty-state" data-i18n="popup.emptyResults">最近一次扫描没有发现无效书签。</div>
      <div id="resultList" class="result-list"></div>
    </section>

    <footer class="popup-footer">
      <div class="version-info" id="versionInfo">智能书签管家</div>
    </footer>
  </div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
